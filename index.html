<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>每日中文閱讀測驗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="top">
      <h1>每日中文閱讀測驗</h1>

      <div class="user-controls">
        <span id="user-name" aria-hidden="true"></span>
        <button id="signout-btn" class="btn ghost" style="display:none">登出</button>
        <div class="lang-select">
          <label for="lang-select">語言</label>
          <select id="lang-select" aria-label="選擇語言">
            <option value="traditional">繁體</option>
            <option value="simplified">简体</option>
          </select>
        </div>
      </div>
    </header>

    <p class="intro">閱讀下面的短文並回答十個問題。每天只能做一次測驗。完成後會給出得分並保存到雲端（Firebase）與瀏覽器本地歷史記錄。</p>

    <section id="quiz-area">
      <h2 id="passage-title"></h2>
      <article id="passage" class="passage"></article>

      <form id="questions-form"></form>

      <div class="actions">
        <button id="submit-btn" class="btn">提交並評分</button>
        <button id="reset-today-btn" class="btn ghost">重置今日嘗試</button>
      </div>

      <div id="result" class="result" aria-live="polite"></div>
    </section>

    <section id="history-area">
      <h3>歷史成績</h3>
      <table id="history-table">
        <thead>
          <tr><th>日期</th><th>得分</th><th>正確/總</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <footer>
      <p>你必須使用 Google 帳號登入才能使用此網站。登入後，成績會儲存在 Firebase Firestore。若要使用其他登入方式，請前往 <a href="signin/index.html">登入頁面</a>。</p>
    </footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
