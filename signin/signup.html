<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>註冊 — 每日中文閱讀測驗</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container">
    <header class="top"><h1>註冊</h1></header>

    <section>
      <p>請填寫以下資料以完成註冊（僅對新 Google 帳號顯示）：</p>
      <form id="signup-form">
        <label>年級
          <select id="grade" required>
            <option value="S1">S1</option>
            <option value="S2">S2</option>
            <option value="S3">S3</option>
            <option value="S4">S4</option>
            <option value="S5">S5</option>
            <option value="S6">S6</option>
          </select>
        </label>
        <label>班別
          <select id="class-letter" required>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </label>
        <label>班號
          <input id="class-number" type="number" min="1" required />
        </label>
        <label>使用者名稱
          <input id="username" type="text" required />
        </label>
        <label>密碼
          <input id="password" type="password" required />
        </label>
        <div style="margin-top:12px">
          <button id="signup-btn" class="btn" type="submit">完成註冊</button>
          <button id="cancel-btn" class="btn ghost" type="button">取消並登出</button>
        </div>
      </form>
    </section>

    <footer>
      <p>密碼僅作為示範 — 若要正式使用請改用 Firebase Authentication 的 Email/Password 或其他安全流程。</p>
    </footer>
  </main>

  <script type="module" src="signup.js"></script>
</body>
</html>
