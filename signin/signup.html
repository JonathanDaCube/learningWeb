<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>註冊 — 每日中文閱讀測驗</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container">
    <header class="top">
      <h1>註冊帳戶資料</h1>
    </header>

    <section>
      <p>歡迎！請完成下列資料以建立您的學生檔案。</p>
      <form id="signup-form">
        <label>年級
          <select id="grade" required>
            <option value="">選擇年級</option>
            <option value="s1">S1</option>
            <option value="s2">S2</option>
            <option value="s3">S3</option>
            <option value="s4">S4</option>
            <option value="s5">S5</option>
            <option value="s6">S6</option>
          </select>
        </label>
        <br>
        <label>班別
          <select id="class-letter" required>
            <option value="">選擇班別</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </label>
        <br>
        <label>班號
          <input id="class-number" type="number" min="1" required />
        </label>
        <br>
        <label>使用者名稱
          <input id="username" type="text" required />
        </label>
        <br>
        <label>密碼（僅用於本系統，將以 SHA-256 儲存）
          <input id="password" type="password" required />
        </label>
        <br>
        <button id="submit-signup" class="btn" type="submit">送出註冊</button>
      </form>
    </section>

    <footer>
      <p>完成註冊後將導回主頁。</p>
    </footer>
  </main>

  <script type="module" src="./signup.js"></script>
</body>
</html>
