<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登入 — 每日中文閱讀測驗</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container">
    <header class="top">
      <h1>請登入</h1>
    </header>

    <section>
      <p>請使用 Google 帳號登入以繼續使用每日中文閱讀測驗。</p>
      <button id="google-signin" class="btn">使用 Google 登入</button>
      <p style="margin-top:12px">登入後將自動導回主頁；若是新帳號，將進行簡單註冊流程。</p>
    </section>

    <footer>
      <p>如果你遇到問題，請確認瀏覽器允許彈跳視窗以完成登入。</p>
    </footer>
  </main>

  <script type="module" src="signin.js"></script>
</body>
</html>
